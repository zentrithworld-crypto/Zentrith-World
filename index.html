<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZENTRITH WORLD</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5A2080">
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiWkVOVFJJVEggV09STEQiLCJzaG9ydF9uYW1lIjoiWkVOVFJJVEgiLCJzdGFydF91cmwiOiIiLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMDAwIiwidGhlbWVfY29sb3IiOiIjNUEyMDgwIn0=">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }
        .pantalla {
            width: 100vw; height: 100vh;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px; color: white;
        }
        .activa { display: flex !important; }

        /* --- PANTALLA DE CARGA PRINCIPAL --- */
        #pantallaCarga {
            background: linear-gradient(180deg, #0A1440 0%, #5A2080 45%, #FF6B2C 100%);
            position: fixed; top:0; left:0; z-index: 9999;
        }
        .estrellas { position: absolute; width:100%; height:100%; overflow:hidden; }
        .estrella {
            position:absolute; background:white; border-radius:50%;
            animation: parpadear 2s infinite alternate;
        }
        @keyframes parpadear {
            0% { opacity:0.3; transform:scale(0.8); } 
            100% { opacity:1; transform:scale(1.2); }
        }
        .logo-z {
            font-size: 160px;
            font-weight: bold;
            text-shadow: 0 0 30px #A0C4FF, 0 0 60px #6094FF;
            margin-bottom: 20px;
            animation: flotar 3s ease-in-out infinite;
        }
        @keyframes flotar {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .titulo {
            font-size: 36px;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-align: center;
        }
        .barra-contenedor {
            width: 80%; max-width: 500px;
            height: 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 25px;
        }
        .barra-progreso {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #FFD029, #9D4EDD, #3A86FF);
            animation: cargar 3s forwards;
        }
        @keyframes cargar {
            100% { width: 100%; }
        }
        .texto-carga { font-size: 20px; opacity:0.8; }

        /* --- PANTALLAS GENERALES --- */
        #pantallaLogin, #formInvitado, #formCorreo, #menuPrincipal {
            background: linear-gradient(180deg, #101a40 0%, #3b1460 50%, #c94a18 100%);
        }
        .subtitulo { font-size:22px; margin-bottom:30px; opacity:0.9; text-align:center; }
        .contenedor-botones, .formulario {
            display:flex; flex-direction:column; gap:15px;
            width:100%; max-width:400px;
        }
        input, select, .btn {
            padding:15px; font-size:18px; border-radius:12px;
            border:none; outline:none; width:100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn {
            font-weight:bold; cursor:pointer; transition:all 0.25s ease;
        }
        .btn:active { transform:scale(0.97); }

        .btn-invitado { background:#22c55e; color:white; }
        .btn-correo { background:#3b82f6; color:white; }
        .btn-facebook { background:#444; color:white; cursor:not-allowed; opacity:0.65; }
        .btn-volver { background:#555; color:white; }
        .btn-entrar { background:#f59e0b; color:white; font-size:20px; }
        .btn-instalar { 
            background: linear-gradient(135deg, #00C853, #00E676); 
            color: black; font-size: 22px; 
            box-shadow: 0 0 25px rgba(0, 200, 83, 0.4);
            margin-bottom: 25px;
        }
        .btn-abrir { 
            background: linear-gradient(135deg, #FFC107, #FFD54F); 
            color: #000; font-size: 22px;
            margin-bottom: 25px;
        }
        .cartel-edad {
            background:rgba(0,0,0,0.5); padding:14px; border-radius:10px;
            text-align:center; font-size:20px; color:#ffd700; display:none;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .icono-candado { margin-right:8px; }
        .datos-perfil {
            background:rgba(0,0,0,0.4); padding:20px; border-radius:15px;
            margin-bottom:25px; width:100%; max-width:400px;
            font-size:17px; line-height:1.6;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .aviso-app {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #aaffcc;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE CARGA -->
    <div class="pantalla activa" id="pantallaCarga">
        <div class="estrellas" id="estrellas"></div>
        <div class="logo-z">Z</div>
        <h1 class="titulo">ZENTRITH WORLD</h1>
        <div class="barra-contenedor"><div class="barra-progreso"></div></div>
        <p class="texto-carga" id="textoEstado">Iniciando sistemas seguros...</p>
    </div>

    <!-- 2. MENÚ PRINCIPAL -->
    <div class="pantalla" id="pantallaLogin">
        <h1 class="titulo">Bienvenido a Zentrith</h1>
        <p class="subtitulo">Elige cómo querés ingresar:</p>

        <div id="avisoApp" class="aviso-app" style="display:none;">✅ Estado: Instalado en este dispositivo</div>
        <button id="botonPrincipal" class="btn btn-instalar" onclick="accionApp()">📥 Instalar Juego</button>

        <div class="contenedor-botones">
            <button class="btn btn-invitado" onclick="mostrarInvitado()">🚀 Cuenta Invitado</button>
            <button class="btn btn-correo" onclick="mostrarCorreo()">📧 Correo Electrónico</button>
            <button class="btn btn-facebook" disabled><span class="icono-candado">🔒</span> Facebook (Próximamente)</button>
        </div>
    </div>

    <!-- 3. FORMULARIO INVITADO -->
    <div class="pantalla" id="formInvitado">
        <h1 class="titulo">Modo Invitado</h1>
        <div class="formulario">
            <input type="text" id="invNombre" placeholder="Tu nombre de jugador" required>
            <select id="invSexo">
                <option value="">¿Eres hombre o mujer?</option>
                <option value="hombre">👨 Hombre</option>
                <option value="mujer">👩 Mujer</option>
            </select>
            <select id="invEdad" onchange="mostrarEdad(this.value, 'cartelInv')">
                <option value="">Selecciona tu año de nacimiento...</option>
            </select>
            <div id="cartelInv" class="cartel-edad"></div>
            <button class="btn btn-entrar" onclick="entrarInvitado()">✅ Entrar al Juego</button>
            <button class="btn btn-volver" onclick="volverAlInicio()">⬅️ Volver</button>
        </div>
    </div>

    <!-- 4. FORMULARIO CORREO -->
    <div class="pantalla" id="formCorreo">
        <h1 class="titulo">Cuenta con Correo</h1>
        <div class="formulario">
            <input type="text" id="corNombre" placeholder="Nombre de usuario">
            <input type="email" id="corMail" placeholder="Tu correo electrónico">
            <input type="password" id="corClave" placeholder="Contraseña">
            <select id="corSexo">
                <option value="">¿Hombre o Mujer?</option>
                <option value="hombre">👨 Hombre</option>
                <option value="mujer">👩 Mujer</option>
            </select>
            <select id="corEdad" onchange="mostrarEdad(this.value, 'cartelCor')">
                <option value="">Año de nacimiento</option>
            </select>
            <div id="cartelCor" class="cartel-edad"></div>
            <button class="btn btn-entrar" onclick="entrarCorreo()">✅ Registrar y Entrar</button>
            <button class="btn btn-volver" onclick="volverAlInicio()">⬅️ Volver</button>
        </div>
    </div>

    <!-- 5. MENÚ DEL JUEGO -->
    <div class="pantalla" id="menuPrincipal">
        <h1 class="titulo">✨ ZENTRITH WORLD ✨</h1>
        <p class="subtitulo">¡Conexión exitosa!</p>
        <div class="datos-perfil" id="datosUsuario"></div>
        <div class="contenedor-botones">
            <button class="btn btn-invitado">▶️ Empezar a Jugar</button>
            <button class="btn btn-correo">⚙️ Configuración</button>
            <button class="btn btn-volver" onclick="cerrarSesion()">🚪 Salir / Cambiar cuenta</button>
        </div>
    </div>

    <script>
        // Estrellas de fondo
        const contenedorEstrellas = document.getElementById('estrellas');
        for(let i=0; i<100; i++){
            const estrella = document.createElement('div');
            estrella.classList.add('estrella');
            estrella.style.left = Math.random()*100 + '%';
            estrella.style.top = Math.random()*100 + '%';
            estrella.style.width = (Math.random()*3 +1) + 'px';
            estrella.style.height = estrella.style.width;
            estrella.style.animationDelay = Math.random()*2 + 's';
            contenedorEstrellas.appendChild(estrella);
        }

        // Cargar años ilimitados
        function cargarAños(selectId){
            const sel = document.getElementById(selectId);
            for(let a=2026; a>=1920; a--){
                const opt = document.createElement('option');
                opt.value = a; opt.textContent = a;
                sel.appendChild(opt);
            }
        }
        cargarAños('invEdad');
        cargarAños('corEdad');

        // Mostrar edad calculada
        function mostrarEdad(anio, cartelId){
            const cartel = document.getElementById(cartelId);
            if(anio){
                const edad = new Date().getFullYear() - parseInt(anio);
                cartel.textContent = "✅ Tenés " + edad + " años";
                cartel.style.display = "block";
            } else {
                cartel.style.display = "none";
            }
        }

        // Sistema de instalación
        let estaInstalado = false;
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            estaInstalado = false;
            actualizarBotonApp();
        });

        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            estaInstalado = true;
        }

        function actualizarBotonApp(){
            const boton = document.getElementById('botonPrincipal');
            const aviso = document.getElementById('avisoApp');
            
            if(estaInstalado){
                boton.textContent = "🚀 Abrir Zentrith World";
                boton.classList.remove('btn-instalar');
                boton.classList.add('btn-abrir');
                aviso.style.display = "block";
                document.getElementById('textoEstado').textContent = "✅ Ya instalado. Listo para jugar.";
            } else {
                boton.textContent = "📥 Instalar Ahora";
                boton.classList.add('btn-instalar');
                boton.classList.remove('btn-abrir');
                aviso.style.display = "none";
                document.getElementById('textoEstado').textContent = "Cargando recursos...";
            }
        }

        async function accionApp(){
            if(estaInstalado){
                alert("✅ Abriendo ZENTRITH WORLD...");
            } else if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if(outcome === 'accepted'){
                    estaInstalado = true;
                    actualizarBotonApp();
                    alert("¡Instalado con éxito! ✅");
                }
                deferredPrompt = null;
            } else {
                alert("ℹ️ Para instalar:\n1. Toca menú del navegador\n2. Elige 'Agregar a pantalla de inicio'");
            }
        }

        // Transición de carga
        setTimeout(() => {
            document.getElementById('pantallaCarga').classList.remove('activa');
            document.getElementById('pantallaLogin').classList.add('activa');
            actualizarBotonApp();
        }, 3500);

        // Navegación
        function ocultarTodas(){
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
        }
        function mostrarPantalla(id){
            ocultarTodas();
            document.getElementById(id).classList.add('activa');
        }
        function volverAlInicio(){
            mostrarPantalla('pantallaLogin');
            limpiarCampos();
        }
        function mostrarInvitado(){ mostrarPantalla('formInvitado'); }
        function mostrarCorreo(){ mostrarPantalla('formCorreo'); }

        // Lógica de cuentas
        function entrarInvitado(){
            const nom = document.getElementById('invNombre').value.trim();
            const sexo = document.getElementById('invSexo').value;
            const anio = document.getElementById('invEdad').value;
            if(!nom) return alert("⚠️ Escribí tu nombre");
            if(!sexo) return alert("⚠️ Elegí Hombre o Mujer");
            if(!anio) return alert("⚠️ Elegí tu año de nacimiento");

            const edad = new Date().getFullYear() - parseInt(anio);
            document.getElementById('datosUsuario').innerHTML = 
                "👤 <strong>Modo:</strong> Invitado Temporal<br>" +
                "🏷️ <strong>Nombre:</strong> " + nom + "<br>" +
                "🚻 <strong>Género:</strong> " + sexo + "<br>" +
                "🎂 <strong>Edad:</strong> " + edad + " años";
            mostrarPantalla('menuPrincipal');
        }

        function entrarCorreo(){
            const nom = document.getElementById('corNombre').value.trim();
            const mail = document.getElementById('corMail').value.trim();
            const clave = document.getElementById('corClave').value;
            const sexo = document.getElementById('corSexo').value;
            const anio = document.getElementById('corEdad').value;
            if(!nom || !mail || !clave) return alert("⚠️ Completa nombre, correo y contraseña");
            if(!sexo) return alert("⚠️ Indica tu género");
            if(!anio) return alert("⚠️ Elige año de nacimiento");

            const edad = new Date().getFullYear() - parseInt(anio);
            document.getElementById('datosUsuario').innerHTML = 
                "🔐 <strong>Cuenta Protegida</strong><br>" +
                "👤 <strong>Usuario:</strong> " + nom + "<br>" +
                "📧 <strong>Correo:</strong> " + mail + "<br>" +
                "🚻 <strong>Género:</strong> " + sexo + "<br>" +
                "🎂 <strong>Edad:</strong> " + edad + " años";
            mostrarPantalla('menuPrincipal');
        }

        function limpiarCampos(){
            document.querySelectorAll('input, select').forEach(i => i.value="");
            document.querySelectorAll('.cartel-edad').forEach(c => c.style.display="none");
        }
        function cerrarSesion(){ volverAlInicio(); }
    </script>
</body>
</html>
